[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "vkframes"
# macOS: Apple silicon, macOS 26 or later (KosmicKrisp, the Vulkan driver, needs Metal 4)
platforms = [{ name = "osx-arm64-macos26", platform = "osx-arm64", macos = "26.0" }, "linux-64", "win-64"]
version = "0.0.1"

[dependencies]
gfortran = "15.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"
cxx-compiler = "*"
cmake = ">=3.25"
ninja = "*"
vulkanscenegraph = "1.1.*"
vsgxchange = "1.1.*"
glslang = "*"
# Vulkan debugging: the validation layer (VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation) and vulkaninfo
vulkan-validation-layers = "*"
vulkan-tools = "*"
# GitHub CLI (CI runs and logs)
gh = "*"
# the default label font (DejaVu Sans; installed in <prefix>/fonts)
font-ttf-dejavu = "*"
# the PySide6 GUI demo (demos/pyside6)
pyside6 = ">=6.11,<7"

[target.unix.dependencies]
pkg-config = "*"

# Vulkan on Metal: KosmicKrisp (Mesa; Khronos' recommendation for Apple silicon, after MoltenVK)
[target.osx-arm64.dependencies]
mesa-kosmickrisp = "*"

# the Vulkan loader uses KosmicKrisp only (Qt depends on MoltenVK, which is installed too)
[target.osx-arm64.activation.env]
VK_DRIVER_FILES = "$CONDA_PREFIX/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json"

# Windows: conda-forge's VSG is MSVC-built, so the C++ layer is built with
# clang++ (MSVC target) into a DLL (see tools/fpm_vsg.py)
[target.win.dependencies]
clangxx = "*"

[tasks]
build = "python tools/fpm_vsg.py build"
test = "python tools/fpm_vsg.py test"
example = "python tools/fpm_vsg.py run --example"
logo = "python media/logo/make_logo.py"
pyside6-build = { cmd = "python demo.py build", cwd = "demos/pyside6" }
pyside6-demo = { cmd = "python demo.py run", cwd = "demos/pyside6" }
# the vkframes / OpenFrames benchmark (bench/README.md): runs both apps in their environments
bench = "python bench/run.py"

# Qt embedding (qt-fortran GUIs): `pixi run -e qt ...`
[feature.qt.dependencies]
qt6-main = ">=6.11,<7"

[environments]
qt = ["qt"]
rocky = ["rocky", "qt"]
openframes = ["openframes", "qt"]

[feature.qt.tasks]
qt-build = { cmd = "python demo.py build", cwd = "demos/qt" }
qt-demo = { cmd = "python demo.py run", cwd = "demos/qt" }
trajectory-build = { cmd = "python demo.py build", cwd = "demos/trajectory" }
trajectory-demo = { cmd = "python demo.py run", cwd = "demos/trajectory" }
bench-vkframes-build = { cmd = "python demo.py build", cwd = "bench/vkframes" }
bench-vkframes = { cmd = "python demo.py run", cwd = "bench/vkframes" }

# Rocky (maps and terrain, optional): `pixi run -e rocky rocky-build` builds
# Rocky from source (tools/build_rocky.py) into this environment
[feature.rocky.dependencies]
entt = "*"
proj = "*"
libgdal-core = "*"
spdlog = "*"
glm = "*"
nlohmann_json = "*"
cpp-httplib = "*"
openssl = "*"
libsqlite = "*"
zlib = "*"
imgui = "*"
git = "*"

[feature.rocky.tasks]
rocky-build = "python tools/build_rocky.py"
moon-data = "python tools/get_moon_dem.py"
moon-demo-build = { cmd = "python demo.py build", cwd = "demos/moon" }
moon-demo = { cmd = "python demo.py run", cwd = "demos/moon" }

# OpenFrames (for the efficiency benchmark, bench/): built from source against
# conda-forge's OpenSceneGraph, `pixi run -e openframes openframes-build`
[feature.openframes]
platforms = ["osx-arm64-macos26", "linux-64"]

[feature.openframes.dependencies]
openscenegraph = "3.6.5.*"
git = "*"

[feature.openframes.target.linux-64.dependencies]
libgl-devel = "*"

[feature.openframes.tasks]
openframes-build = { cmd = "python demo.py openframes", cwd = "bench/openframes" }
bench-openframes-build = { cmd = "python demo.py build", cwd = "bench/openframes" }
bench-openframes = { cmd = "python demo.py run", cwd = "bench/openframes" }
