[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "vkframes"
# moltenvk needs macOS >= 14
platforms = [{ name = "osx-arm64-macos14", platform = "osx-arm64", macos = "14.0" }, "linux-64", "win-64"]
version = "0.0.1"

[dependencies]
gfortran = "15.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"
cxx-compiler = "*"
cmake = ">=3.25"
ninja = "*"
vulkanscenegraph = "1.1.*"
vsgxchange = "1.1.*"
glslang = "*"
# the default label font (DejaVu Sans; installed in <prefix>/fonts)
font-ttf-dejavu = "*"
# the PySide6 GUI demo (demos/pyside6)
pyside6 = ">=6.11,<7"

[target.unix.dependencies]
pkg-config = "*"

[target.osx.dependencies]
moltenvk = "*"

# Windows: conda-forge's VSG is MSVC-built, so the C++ layer is built with
# clang++ (MSVC target) into a DLL (see tools/fpm_vsg.py)
[target.win.dependencies]
clangxx = "*"

[tasks]
build = "python tools/fpm_vsg.py build"
test = "python tools/fpm_vsg.py test"
example = "python tools/fpm_vsg.py run --example"
pyside6-build = { cmd = "python demo.py build", cwd = "demos/pyside6" }
pyside6-demo = { cmd = "python demo.py run", cwd = "demos/pyside6" }

# MoltenVK logs every instance/device at "info"; show warnings and errors only
[target.osx.activation.env]
MVK_CONFIG_LOG_LEVEL = "2"

# Qt embedding (qt-fortran GUIs): `pixi run -e qt ...`
[feature.qt.dependencies]
qt6-main = ">=6.11,<7"

[environments]
qt = ["qt"]
rocky = ["rocky", "qt"]

[feature.qt.tasks]
qt-build = { cmd = "python demo.py build", cwd = "demos/qt" }
qt-demo = { cmd = "python demo.py run", cwd = "demos/qt" }

# Rocky (maps and terrain, optional): `pixi run -e rocky rocky-build` builds
# Rocky from source (tools/build_rocky.py) into this environment
[feature.rocky.dependencies]
entt = "*"
proj = "*"
libgdal-core = "*"
spdlog = "*"
glm = "*"
nlohmann_json = "*"
cpp-httplib = "*"
openssl = "*"
libsqlite = "*"
zlib = "*"
imgui = "*"
git = "*"

[feature.rocky.tasks]
rocky-build = "python tools/build_rocky.py"
moon-data = "python tools/get_moon_dem.py"
moon-demo-build = { cmd = "python demo.py build", cwd = "demos/moon" }
moon-demo = { cmd = "python demo.py run", cwd = "demos/moon" }
