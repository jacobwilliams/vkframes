name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]   # macOS 26: KosmicKrisp needs Metal 4
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          environments: default qt

      # Linux runners have no GPU: Mesa's CPU Vulkan driver (lavapipe), and Xvfb
      # for windows. The conda Vulkan loader is pointed at lavapipe explicitly.
      - name: Vulkan driver and X server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers xvfb
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" >> "$GITHUB_ENV"

      - name: Build library and examples
        run: pixi run build

      - name: Test geometry (headless)
        run: pixi run test test_geometry

      # Windows runners have no Vulkan driver.
      - name: Test Vulkan device
        if: runner.os != 'Windows'
        continue-on-error: ${{ runner.os == 'macOS' }}   # Vulkan needs Metal in the runner VM
        run: pixi run test test_vulkan

      - name: Render examples (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p captures
          xvfb-run -a -s "-screen 0 1280x1024x24" pixi run example orbit -- 30 "$PWD/captures/orbit.png"
          xvfb-run -a -s "-screen 0 1280x1024x24" pixi run example precision -- 10 "$PWD/captures/precision.png"
          xvfb-run -a -s "-screen 0 1280x1024x24" pixi run test test_record
          xvfb-run -a -s "-screen 0 1280x1024x24" pixi run example record_video -- "$PWD/captures/record_video.mp4" 2

      - name: Render examples (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p captures
          pixi run example orbit -- 30 "$PWD/captures/orbit.png"
          pixi run example precision -- 10 "$PWD/captures/precision.png"
          pixi run test test_record
          pixi run example record_video -- "$PWD/captures/record_video.mp4" 2

      # The Qt demo (separate fpm project; vkframes embedded in a qt-fortran window).
      - name: Build the Qt demo
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: pixi run -e qt qt-build

      - name: Run the Qt demo (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true   # VSG's xcb embedding with Qt is untested
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" pixi run -e qt qt-demo --capture "$PWD/captures/qt_demo.png" --capture-frame 30 --quit-after 10

      - name: Run the Qt demo (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: pixi run -e qt qt-demo --capture "$PWD/captures/qt_demo.png" --capture-frame 30 --quit-after 10

      # The rendezvous demo (qt-fortran; a click on the path simulated with --click).
      - name: Build the rendezvous demo
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: pixi run -e qt rpo-build

      - name: Run the rendezvous demo (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: pixi run -e qt rpo-demo --preset 1 --click 1500 --capture "$PWD/captures/rpo_demo.png" --capture-frame 90 --quit-after 10

      # The CR3BP demo (qt-fortran; a click on a dot simulated with --click-near).
      - name: Build the CR3BP demo
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: pixi run -e qt cr3bp-build

      - name: Run the CR3BP demo (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: pixi run -e qt cr3bp-demo --click-near 0.8 0.05 --capture "$PWD/captures/cr3bp_demo.png" --capture-frame 90 --quit-after 10

      # The trajectory design demo (qt-fortran; the velocity arrow dragged with --drag-test).
      - name: Build the design demo
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: pixi run -e qt design-build

      - name: Run the design demo (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: pixi run -e qt design-demo --drag-test --capture "$PWD/captures/design_demo.png" --capture-frame 28 --quit-after 10

      # The PySide6 demo (separate fpm project, a shared library driven by a
      # Python GUI through ctypes).
      - name: Build the PySide6 demo
        continue-on-error: ${{ runner.os == 'Windows' }}   # fpm shared libraries + vkf.dll are untested
        run: pixi run pyside6-build

      - name: Run the PySide6 demo (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true   # VSG's xcb embedding with Qt is untested
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1280x1024x24" pixi run pyside6-demo --capture "$PWD/captures/pyside6_demo.png" --capture-frame 30 --quit-after 10

      - name: Run the PySide6 demo (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: pixi run pyside6-demo --capture "$PWD/captures/pyside6_demo.png" --capture-frame 30 --quit-after 10

      - name: Upload captures
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.os }}
          path: captures/
          if-no-files-found: ignore

  # The website (web/) with the API docs (FORD, into web/api), published to the
  # gh-pages branch from master. (GitHub Pages: Settings > Pages > Deploy from a
  # branch, gh-pages, / (root).)
  website:
    name: website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to push the gh-pages branch
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true
          environments: default

      - name: Build the API docs
        run: pixi run ford ford.md

      - name: Publish web/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true     # one commit: the site as built, no history of old builds
