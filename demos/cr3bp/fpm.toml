name = "vkframes-cr3bp-demo"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "The Earth-Moon circular restricted three-body problem, drawn by vkframes in a qt-fortran GUI"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
# OpenMP: the cloud's states propagated in parallel (Color by: fate)
openmp = "*"
qt-fortran = { git = "https://github.com/jacobwilliams/qt-fortran.git", rev = "49db54cf1336e8fe8f5fe632330579a0fc0e3847" }
