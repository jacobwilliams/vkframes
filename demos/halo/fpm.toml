name = "vkframes-halo-demo"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "An Earth-Moon L1 halo orbit's invariant manifolds and zero-velocity curves (CR3BP), drawn by vkframes"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
# OpenMP: the manifolds' trajectories propagated in parallel
openmp = "*"
