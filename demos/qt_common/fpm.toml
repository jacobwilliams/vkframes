name = "vkframes-qt-common"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "What the vkframes demos in qt-fortran GUIs share: Qt's input as VSG's, and a window's native surface going away"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
qt-fortran = { git = "https://github.com/jacobwilliams/qt-fortran.git", rev = "4034a68194c5f2286366ef3827ed3d9b49c63759" }
