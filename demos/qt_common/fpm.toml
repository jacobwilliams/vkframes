name = "vkframes-qt-common"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "What the vkframes demos in qt-fortran GUIs share: Qt's input as VSG's, a window's native surface going away, and two-body motion (kepler)"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
qt-fortran = { git = "https://github.com/jacobwilliams/qt-fortran.git", rev = "239d183d28e76155ccc60005322e4be2e9452b76" }
