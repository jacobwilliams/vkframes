name = "vkframes-dispersions-demo"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "Monte Carlo dispersions of a transfer burn: many samples propagated, their cloud and its 3-sigma ellipsoid, with vkframes in a qt-fortran GUI"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
qt-fortran = { git = "https://github.com/jacobwilliams/qt-fortran.git", rev = "4034a68194c5f2286366ef3827ed3d9b49c63759" }
vkframes-qt-common = { path = "../qt_common" }
