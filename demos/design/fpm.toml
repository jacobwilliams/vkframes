name = "vkframes-design-demo"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "Trajectory design with the mouse: initial position and velocity arrows dragged, the orbit following, with vkframes in a qt-fortran GUI"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
qt-fortran = { git = "https://github.com/jacobwilliams/qt-fortran.git", rev = "239d183d28e76155ccc60005322e4be2e9452b76" }
vkframes-qt-common = { path = "../qt_common" }
