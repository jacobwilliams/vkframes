name = "vkframes-burn-demo"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "A burn designed with the mouse: a delta-v arrow dragged in a spacecraft view, the trajectory following in it and in an orbit view, with vkframes in a qt-fortran GUI"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
qt-fortran = { git = "https://github.com/jacobwilliams/qt-fortran.git", rev = "4034a68194c5f2286366ef3827ed3d9b49c63759" }
vkframes-qt-common = { path = "../qt_common" }
