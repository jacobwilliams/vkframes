name = "vkframes-moon-demo"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "A lunar vkframes scene (Rocky terrain) in a qt-fortran GUI"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
qt-fortran = { git = "https://github.com/jacobwilliams/qt-fortran.git", rev = "7c7f390a265a475422c4fc75327f4d9a237eb0d6" }
