name = "vkframes"
version = "0.0.1"
license = "Apache"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "Modern Fortran spacecraft trajectory visualization on VulkanSceneGraph"
keywords = ["vulkan", "visualization", "trajectory", "spacecraft"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
# The C++ VSG layer in src/vsg is compiled by fpm on Linux and macOS (and built
# as a separate DLL on Windows). The compiler, VSG flags and the libraries to
# link come from tools/fpm_vsg.py (FPM_CXX / FPM_CXXFLAGS / FPM_LDFLAGS), so
# build through it: `pixi run build`, `pixi run test`, ...

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
