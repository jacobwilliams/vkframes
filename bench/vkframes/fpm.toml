name = "vkframes-bench"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "The vkframes side of the vkframes / OpenFrames benchmark (a qt-fortran app)"

[build]
auto-executables = true
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
vkframes = { path = "../.." }
vkframes-bench-common = { path = "../common" }
qt-fortran = { git = "https://github.com/jacobwilliams/qt-fortran.git", rev = "a72fe43e6c4974879456d5df8e53856a84b88505" }
